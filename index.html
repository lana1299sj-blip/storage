<script>
const DEFAULT_L1 = ['客廳', '臥室', '書房', '廚房'];
const COLORS = ['#e11d48', '#2563eb', '#059669', '#d97706', '#7c3aed', '#0891b2', '#c026d3', '#4d7c0f'];
let items = [], maps = {}, mapPaths = {}, pins = [], urls = [], photo = null;
let sp = '', sel2 = '', sel3 = '', editing = false, showLbl = true, mapHidden = false, extra = [];
let flashKey = null, flashT, pendingXY = null, editPin = null, drag = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uniq = a => [...new Set(a.filter(Boolean))];
const colorOf = n => { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };
const pinOf = (l1, name) => pins.find(p => p.l1 === l1 && p.name === name);
const spaces = () => uniq([...DEFAULT_L1, ...items.map(i => i.l1), ...Object.keys(maps), ...extra]);

/* ---------- Supabase：資料、圖片 ---------- */
const BUCKET = 'photos';
let sb, user = null, busyN = 0, reloadT, channel, booted = false;
const urlCache = {};
function busy(d) { busyN += d; $('loading').classList.toggle('hidden', busyN <= 0); }
async function guard(fn) {
  busy(1);
  try { return await fn(); }
  catch (err) { alert('發生錯誤：' + (err.message || err)); }
  finally { busy(-1); }
}
const must = r => { if (r.error) throw r.error; return r.data; };

async function signed(paths) {   // 私有圖片的臨時網址（24 小時），並快取避免重複下載
  const now = Date.now(), need = paths.filter(p => !urlCache[p] || urlCache[p].exp < now + 3600e3);
  if (need.length) must(await sb.storage.from(BUCKET).createSignedUrls(need, 86400)).forEach(o => {
    if (o.signedUrl) urlCache[o.path] = { url: o.signedUrl, exp: now + 86400e3 };
  });
  return p => (urlCache[p] && urlCache[p].url) || '';
}
async function upload(blob) {
  const path = `${user.id}/${crypto.randomUUID()}.jpg`;
  must(await sb.storage.from(BUCKET).upload(path, blob, { contentType: 'image/jpeg' }));
  return path;
}
const rm = paths => { const a = paths.filter(Boolean); return a.length ? sb.storage.from(BUCKET).remove(a) : null; };

async function load(spin = true) {
  if (spin) busy(1);
  try {
    const [it, sps, pn] = await Promise.all([
      sb.from('items').select('*').order('created_at', { ascending: false }).then(must),
      sb.from('spaces').select('*').then(must),
      sb.from('pins').select('*').then(must)
    ]);
    const urlOf = await signed([...it.map(r => r.photo_path), ...sps.map(r => r.map_path)].filter(Boolean));
    items = it.map(r => ({ id: r.id, name: r.name, l1: r.l1, l2: r.l2 || '', l3: r.l3 || '', quantity: r.quantity || 1, note: r.note || '', photo_path: r.photo_path, photoUrl: urlOf(r.photo_path), createdAt: new Date(r.created_at).getTime() }));
    maps = {}; mapPaths = {};
    sps.forEach(r => { if (r.map_path) { maps[r.name] = urlOf(r.map_path); mapPaths[r.name] = r.map_path; } });
    pins = pn.map(r => ({ id: r.id, l1: r.space, name: r.name, no: r.no, x: r.x, y: r.y }));
  } finally { if (spin) busy(-1); }
}
async function delItem(id) {
  const it = items.find(i => i.id === id);
  must(await sb.from('items').delete().eq('id', id));
  if (it) await rm([it.photo_path]);
}

/* ---------- 圖片壓縮 ---------- */
function compress(file, maxW = 800) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, maxW / img.width);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? res(b) : rej(new Error('壓縮失敗')), 'image/jpeg', 0.7);
    };
    img.onerror = () => rej(new Error('無法讀取圖片'));
    img.src = u;
  });
}

/* ---------- 三層選項 ---------- */
function options(level, a, b) {
  let src = items;
  if (level >= 2) src = src.filter(i => i.l1 === a);
  if (level >= 3) src = src.filter(i => i.l2 === b);
  const hist = uniq(src.map(i => i['l' + level]));
  return level === 1 ? uniq([...DEFAULT_L1, ...hist]) : hist;
}

/* ---------- 主畫面渲染 ---------- */
function renderAll() { renderTabs(); renderMap(); renderList(); }

function renderTabs() {
  $('tabs').innerHTML = spaces().map(s => `<button class="chip ${s === sp ? 'on' : ''}" data-sp="${esc(s)}">${esc(s)}</button>`).join('')
    + '<button class="chip" data-addsp="1">＋ 空間</button>';
}

function flash(l1, name, ms) {
  flashKey = l1 + '|' + name;
  clearTimeout(flashT);
  flashT = setTimeout(() => { flashKey = null; renderMap(); }, ms);
}

function renderMap() {
  const has = !!maps[sp];
  $('mapTools').classList.toggle('hidden', !has || mapHidden);
  $('mapBox').classList.toggle('hidden', mapHidden);
  $('mapHint').classList.toggle('hidden', mapHidden);
  $('mapToggle').textContent = mapHidden ? '🗺️ 顯示空間圖' : '🙈 隱藏空間圖';
  $('mapEdit').classList.toggle('on', editing);
  $('mapEdit').textContent = '✏️ 編輯標記：' + (editing ? '開' : '關');

/* ---------- AI 圖片辨識（Google Gemini） ---------- */
const AI_KEY = 'gemini_api_key', AI_MODEL = 'gemini_model', AI_DEFAULT_MODEL = 'gemini-flash-lite-latest';
const AI_PROMPT = '請辨識這張照片中最主要的收納物品，直接用繁體中文給出一個簡短、精確的物品名稱（例如：白色行動電源、十字螺絲起子、黑色無線滑鼠），字數控制在 2 到 10 個字以內，不要加任何標點符號、括號或額外說明文字。';
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const lsSet = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) { alert('無法儲存設定（瀏覽器禁止儲存資料）'); } };
function openAiSheet() { $('aiKey').value = lsGet(AI_KEY); $('aiModel').value = lsGet(AI_MODEL); $('aiSheet').classList.remove('hidden'); }
const closeAiSheet = () => $('aiSheet').classList.add('hidden');
$('aiSetBtn').onclick = openAiSheet;
$('aiCancel').onclick = closeAiSheet;
$('aiSave').onclick = () => {
  const k = $('aiKey').value.trim();
  if (!k) return alert('請貼上 Gemini API Key');
  lsSet(AI_KEY, k); lsSet(AI_MODEL, $('aiModel').value.trim());
  closeAiSheet(); alert('已儲存');
};
$('aiClear').onclick = () => { if (confirm('確定清除這支手機上儲存的金鑰？')) { lsSet(AI_KEY, ''); $('aiKey').value = ''; } };

const blobToB64 = b => new Promise((res, rej) => {   // 只取 Base64 本體，不含 data:image/jpeg;base64, 前綴
  const r = new FileReader();
  r.onload = () => res(String(r.result).split(',')[1]);
  r.onerror = () => rej(new Error('讀取照片失敗'));
  r.readAsDataURL(b);
});
const cleanAiName = t => t.split('\n')[0]
  .replace(/^["'“”‘’「」『』（(\[【\s]+|["'“”‘’「」『』）)\]】。.，,、！!\s]+$/g, '')
  .replace(/\s+/g, ' ').trim();
async function aiRecognize(blob) {
  const key = lsGet(AI_KEY), model = lsGet(AI_MODEL) || AI_DEFAULT_MODEL;
  const data = await blobToB64(blob);
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 30000);
  let r, d;
  try {
    r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({ contents: [{ parts: [{ text: AI_PROMPT }, { inline_data: { mime_type: 'image/jpeg', data } }] }] }),
      signal: ctl.signal
    });
    d = await r.json().catch(() => ({}));
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? '辨識逾時，請稍後再試' : '無法連線到 Gemini：' + e.message);
  } finally { clearTimeout(t); }
  if (!r.ok) {
    const m = (d.error && d.error.message) || ('HTTP ' + r.status);
    if (r.status === 429) throw new Error('已超過免費額度或呼叫太頻繁，請稍後再試');
    if (r.status === 404) throw new Error('找不到模型「' + model + '」，請到「🔑 AI 設定」改用其他模型名稱');
    if (/api key/i.test(m)) throw new Error('API Key 無效，請到「🔑 AI 設定」重新輸入');
    throw new Error(m);
  }
  if (d.promptFeedback && d.promptFeedback.blockReason) throw new Error('這張照片被 AI 安全機制擋下（' + d.promptFeedback.blockReason + '）');
  const parts = (((d.candidates || [])[0] || {}).content || {}).parts || [];
  const name = cleanAiName(parts.map(p => p.text || '').join('').trim());
  if (!name) throw new Error('AI 沒有給出名稱，請換個角度重拍，或手動輸入');
  return name;
}
$('aiBtn').onclick = async () => {
  if (!lsGet(AI_KEY)) { alert('尚未設定 Gemini API Key，請先輸入金鑰'); return openAiSheet(); }
  let blob = photo;   // 表單裡的照片已是壓縮過的 JPEG（含畫筆筆跡）
  if (!blob && !$('prevWrap').classList.contains('hidden')) {   // 編輯模式：使用現有照片
    try { blob = await (await fetch($('prev').src)).blob(); } catch (e) { return alert('無法讀取目前的照片：' + e.message); }
  }
  if (!blob) return alert('請先拍照或選取照片，再使用 AI 辨識');
  const btn = $('aiBtn'); btn.disabled = true; btn.textContent = '辨識中...';
  setScanMsg('⏳ AI 辨識中...', 'info');
  try {
    const name = await aiRecognize(blob);
    $('name').value = name;
    setScanMsg('✨ AI 辨識結果：' + name + '（可再手動修改）', 'ok');
  } catch (e) { setScanMsg('AI 辨識失敗：' + e.message, 'warn'); }
  finally { btn.disabled = false; btn.textContent = '✨ AI 辨識'; }
};

/* ---------- 條碼掃描與商品名稱查詢 ---------- */
let scanner = null;
function setScanMsg(text, kind) {
  const c = { info: 'text-indigo-600', ok: 'text-green-700', warn: 'text-amber-700' }[kind];
  $('scanMsg').className = 'text-sm mt-1 ' + c;
  $('scanMsg').textContent = text;
}
async function stopScan() {   // 關閉掃描：務必釋放相機
  const sc = scanner; scanner = null;
  $('scan').classList.add('hidden');
  const tracks = [];
  document.querySelectorAll('#scanReader video').forEach(v => v.srcObject && tracks.push(...v.srcObject.getTracks()));
  if (sc) { try { await sc.stop(); } catch (e) {} try { sc.clear(); } catch (e) {} }
  tracks.forEach(t => t.stop());
}
async function openScan() {
  if (typeof Html5Qrcode === 'undefined') return alert('條碼掃描套件載入失敗，請確認網路後重新整理頁面');
  $('scan').classList.remove('hidden');
  const F = Html5QrcodeSupportedFormats;
  const sc = scanner = new Html5Qrcode('scanReader', {
    formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    verbose: false
  });
  let done = false;
  try {
    await sc.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: (w, h) => ({ width: Math.floor(w * 0.85), height: Math.floor(Math.min(h * 0.5, 160)) }) },
      async code => { if (done) return; done = true; await stopScan(); lookupBarcode(code); },
      () => {}
    );
    if (scanner !== sc) { try { await sc.stop(); } catch (e) {} }   // 啟動期間被關閉 → 再停一次
  } catch (err) {
    await stopScan();
    alert('無法開啟相機：' + (err.message || err) + '\n請確認已允許相機權限。');
  }
}
$('scanBtn').onclick = openScan;
$('scanClose').onclick = stopScan;
document.addEventListener('visibilitychange', () => { if (document.hidden && scanner) stopScan(); });

async function fetchJSON(url) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
async function findName(code) {
  if (/^97[89]/.test(code)) {   // 書籍 ISBN → Google Books
    try {
      const d = await fetchJSON('https://www.googleapis.com/books/v1/volumes?q=isbn:' + code);
      const v = d.items && d.items[0] && d.items[0].volumeInfo;
      if (v && v.title) return v.title;
    } catch (e) { console.warn('Google Books', e); }
  }
  for (const host of ['world.openfoodfacts.org', 'world.openbeautyfacts.org']) {   // 一般商品 → Open Food / Beauty Facts
    try {
      const d = await fetchJSON(`https://${host}/api/v2/product/${code}.json?fields=product_name,product_name_zh`);
      const p = d && d.product;
      const n = p && (p.product_name_zh || p.product_name);
      if (n && n.trim()) return n.trim();
    } catch (e) { console.warn(host, e); }
  }
  return '';
}
async function lookupBarcode(code) {
  setScanMsg('⏳ 正在查詢商品資訊...', 'info');
  let name = '';
  try { name = await findName(code); } catch (e) { console.warn(e); }
  const tag = '條碼：' + code, note = $('note').value.trim();
  if (!note.includes(tag)) $('note').value = note ? note + '\n' + tag : tag;
  if (name) { $('name').value = name; setScanMsg('✅ 已帶入商品名稱：' + name, 'ok'); }
  else setScanMsg('查無商品名稱，請手動輸入（條碼已填入備註）', 'warn');
}

/* ---------- 畫筆標記（Canvas） ---------- */
const cv = $('cv'), cx = cv.getContext('2d');
let ed = null;
function edRedraw() {
  cx.drawImage(ed.base, 0, 0);
  ed.strokes.forEach(s => {
    cx.strokeStyle = s.c; cx.lineWidth = ed.lw; cx.lineCap = cx.lineJoin = 'round';
    cx.beginPath();
    s.pts.forEach(([a, b], i) => i ? cx.lineTo(a, b) : cx.moveTo(a, b));
    if (s.pts.length === 1) cx.lineTo(s.pts[0][0] + .01, s.pts[0][1]);
    cx.stroke();
  });
}
function edFit() {   // 依可用空間縮放顯示大小（畫布實際解析度不變）
  const box = cv.parentElement, k = Math.min((box.clientWidth - 16) / cv.width, (box.clientHeight - 16) / cv.height);
  cv.style.width = cv.width * k + 'px'; cv.style.height = cv.height * k + 'px';
}
async function openDraw(src, o, cb) {   // src：Blob 或圖片網址；cb(blob) 在按「完成」後呼叫
  let blob = src;
  if (typeof src === 'string') {
    try { blob = await (await fetch(src)).blob(); } catch (e) { return alert('無法載入照片：' + e.message); }
  }
  const img = new Image(), u = URL.createObjectURL(blob);
  img.onload = () => {
    const k = Math.min(1, o.maxW / img.width);
    cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    const base = document.createElement('canvas'); base.width = cv.width; base.height = cv.height;
    base.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(u);
    ed = { base, strokes: [], cur: null, color: '#ef4444', lw: Math.max(4, cv.width / 110), cb, force: !!o.force };
    $('drawOk').textContent = o.label || '✅ 完成';
    document.querySelectorAll('.pen').forEach(b => b.classList.toggle('on', b.dataset.c === ed.color));
    edRedraw();
    $('draw').classList.remove('hidden');
    edFit();
  };
  img.onerror = () => { URL.revokeObjectURL(u); alert('無法讀取圖片'); };
  img.src = u;
}
const edPt = e => {
  const t = e.touches ? (e.touches[0] || e.changedTouches[0]) : e, r = cv.getBoundingClientRect();
  return [(t.clientX - r.left) * cv.width / r.width, (t.clientY - r.top) * cv.height / r.height];
};
function edSeg(a, b) {
  cx.strokeStyle = ed.cur.c; cx.lineWidth = ed.lw; cx.lineCap = cx.lineJoin = 'round';
  cx.beginPath(); cx.moveTo(a[0], a[1]); cx.lineTo(b[0] + .01, b[1]); cx.stroke();
}
function edDown(e) {
  e.preventDefault();
  if (!ed) return;
  const p = edPt(e); ed.cur = { c: ed.color, pts: [p] }; ed.strokes.push(ed.cur); edSeg(p, p);
}
function edMove(e) {
  if (!ed || !ed.cur) return;
  e.preventDefault();
  const p = edPt(e), pts = ed.cur.pts; edSeg(pts[pts.length - 1], p); pts.push(p);
}
function edUp(e) { if (ed && ed.cur) { e.preventDefault(); ed.cur = null; } }
const NP = { passive: false };   // 必須 non-passive，preventDefault 才能擋住畫面捲動
['touchstart', 'mousedown'].forEach(n => cv.addEventListener(n, edDown, NP));
['touchmove', 'mousemove'].forEach(n => cv.addEventListener(n, edMove, NP));
['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(n => cv.addEventListener(n, edUp, NP));
document.querySelectorAll('.pen').forEach(b => b.onclick = () => {
  if (!ed) return;
  ed.color = b.dataset.c;
  document.querySelectorAll('.pen').forEach(x => x.classList.toggle('on', x === b));
});
$('drawUndo').onclick = () => { if (ed && ed.strokes.length) { ed.strokes.pop(); edRedraw(); } };
$('drawClear').onclick = () => { if (ed) { ed.strokes = []; edRedraw(); } };
const closeDraw = () => { $('draw').classList.add('hidden'); ed = null; };
$('drawCancel').onclick = closeDraw;
$('drawOk').onclick = () => {
  if (!ed) return;
  const { cb, force, strokes } = ed;
  if (!force && !strokes.length) return closeDraw();   // 沒畫任何東西：維持原照片，不重新壓縮
  cv.toBlob(b => { closeDraw(); if (b) cb(b); else alert('匯出失敗'); }, 'image/jpeg', 0.7);
};
window.addEventListener('resize', () => { if (ed) edFit(); });
$('drawBtn').onclick = () => openDraw(photo || $('prev').src, { maxW: 800 }, blob => {
  photo = blob;
  $('prev').src = URL.createObjectURL(blob);
  $('prevInfo').textContent = '已加上手繪標記，儲存時會一併上傳';
});

/* ---------- 底圖 ---------- */
async function setMap(e) {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const space = sp;
  openDraw(f, { maxW: 1200, label: '✅ 完成並上傳', force: true }, async blob => {
    await guard(async () => {
      const path = await upload(blob);
      must(await sb.from('spaces').upsert({ user_id: user.id, name: space, map_path: path }, { onConflict: 'user_id,name' }));
      await rm([mapPaths[space]]);
      await load(false); renderAll();
    });
  });
}
$('mapCamIn').onchange = setMap; $('mapGalIn').onchange = setMap;
$('mapCam').onclick = () => $('mapCamIn').click();
$('mapGal').onclick = () => $('mapGalIn').click();
$('mapEdit').onclick = () => { editing = !editing; renderMap(); };
$('mapToggle').onclick = () => { mapHidden = !mapHidden; editing = false; renderMap(); };
$('mapLbl').onclick = () => { showLbl = !showLbl; renderMap(); };
$('mapDel').onclick = async () => {
  if (!confirm(`移除「${sp}」的視覺圖與所有圖釘？（物品紀錄不會被刪除）`)) return;
  await guard(async () => {
    must(await sb.from('pins').delete().eq('space', sp));
    must(await sb.from('spaces').delete().eq('name', sp));
    await rm([mapPaths[sp]]);
    sel2 = ''; editing = false;
    await load(false); renderAll();
  });
};

/* ---------- 圖釘：新增、拖曳、編輯 ---------- */
const xy = e => {
  const r = $('mapBox').querySelector('img').getBoundingClientRect();
  const f = (v, m) => +Math.min(100, Math.max(0, v / m * 100)).toFixed(2);
  return { x: f(e.clientX - r.left, r.width), y: f(e.clientY - r.top, r.height) };
};
$('mapBox').addEventListener('click', e => {
  const pb = e.target.closest('[data-pin]');
  if (pb) { if (!editing) pick(pb.dataset.pin); return; }
  if (!editing || !e.target.closest('img')) return;
  const p = xy(e); openPin(p.x, p.y, null);
});
$('mapBox').addEventListener('pointerdown', e => {
  const pb = e.target.closest('.pin.edit');
  if (!pb) return;
  drag = { el: pb, name: pb.dataset.pin, sx: e.clientX, sy: e.clientY, moved: false, pos: null };
  pb.setPointerCapture(e.pointerId);
});
$('mapBox').addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 8) return;
  drag.moved = true; drag.pos = xy(e);
  drag.el.style.left = drag.pos.x + '%'; drag.el.style.top = drag.pos.y + '%';
  if (drag.el.classList.contains('cap')) drag.el.style.transform = `translate(-${drag.pos.x}%,-50%)`;
});
$('mapBox').addEventListener('pointerup', async () => {
  if (!drag) return;
  const d = drag; drag = null;
  const p = pinOf(sp, d.name);
  if (!p) return;
  if (d.moved && d.pos) {
    await guard(async () => { must(await sb.from('pins').update(d.pos).eq('id', p.id)); await load(false); renderAll(); });
  } else openPin(p.x, p.y, p);
});
$('mapBox').addEventListener('pointercancel', () => { drag = null; renderMap(); });

function openPin(x, y, p) {
  pendingXY = { x, y }; editPin = p;
  $('pinName').value = p ? p.name : '';
  $('pinDel').classList.toggle('hidden', !p);
  renderPinChips();
  $('pinSheet').classList.remove('hidden');
}
function renderPinChips() {
  const v = $('pinName').value.trim(), opts = options(2, sp);
  $('pinChips').innerHTML = opts.length
    ? opts.map(o => `<button type="button" data-pc="${esc(o)}" class="chip ${o === v ? 'on' : ''}">${esc(o)}</button>`).join('')
    : '<span class="text-sm text-gray-400">此空間尚無櫃子紀錄，請直接輸入名稱</span>';
}
$('pinName').oninput = renderPinChips;
const closePin = () => $('pinSheet').classList.add('hidden');
$('pinCancel').onclick = closePin;
$('pinSave').onclick = async () => {
  const name = $('pinName').value.trim();
  if (!name) return alert('請輸入櫃子／區域名稱');
  const ex = pinOf(sp, name);
  const no = editPin ? editPin.no : ex ? ex.no : 1 + Math.max(0, ...pins.filter(p => p.l1 === sp).map(p => p.no));
  await guard(async () => {
    if (editPin && editPin.name !== name) {   // 改名：同步更新該櫃子下的物品
      must(await sb.from('items').update({ l2: name }).eq('l1', sp).eq('l2', editPin.name));
      must(await sb.from('pins').delete().eq('id', editPin.id));
      if (sel2 === editPin.name) sel2 = name;
    }
    must(await sb.from('pins').upsert({ user_id: user.id, space: sp, name, no, x: pendingXY.x, y: pendingXY.y }, { onConflict: 'user_id,space,name' }));
    closePin(); await load(false); renderAll();
  });
};
$('pinDel').onclick = async () => {
  if (!editPin || !confirm(`刪除「${editPin.name}」的圖釘？（物品紀錄不會被刪除）`)) return;
  await guard(async () => {
    must(await sb.from('pins').delete().eq('id', editPin.id));
    if (sel2 === editPin.name) sel2 = '';
    closePin(); await load(false); renderAll();
  });
};

/* ---------- 新增物品 ---------- */
function renderFormChips() {
  const v = [$('l1').value.trim(), $('l2').value.trim(), $('l3').value.trim()];
  for (let l = 1; l <= 3; l++) {
    const opts = options(l, v[0], v[1]);
    $('c' + l).innerHTML = opts.length
      ? opts.map(o => `<button type="button" data-fl="${l}" data-v="${esc(o)}" class="chip ${o === v[l - 1] ? 'on' : ''}">${esc(o)}</button>`).join('')
      : '<span class="text-sm text-gray-400">尚無紀錄，請直接輸入新名稱</span>';
  }
}
['l1', 'l2', 'l3'].forEach(id => $(id).addEventListener('input', renderFormChips));
let editId = null;
const clampQty = v => Math.max(1, parseInt(v, 10) || 1);
function openForm(it) {
  editId = it ? it.id : null;
  $('scanMsg').className = 'hidden';
  $('sheetTitle').textContent = it ? '編輯物品' : '新增物品';
  $('name').value = it ? it.name : '';
  $('qty').value = it ? it.quantity : 1;
  $('note').value = it ? it.note : '';
  $('l1').value = it ? it.l1 : sp; $('l2').value = it ? it.l2 : sel2; $('l3').value = it ? it.l3 : sel3;
  photo = null; $('camIn').value = ''; $('galIn').value = '';
  if (it && it.photoUrl) {
    $('prev').src = it.photoUrl;
    $('prevInfo').textContent = '目前的照片（沒有重新拍照或選取就會保留）';
    $('prevWrap').classList.remove('hidden');
  } else $('prevWrap').classList.add('hidden');
  renderFormChips();
  $('sheet').classList.remove('hidden');
}
$('addBtn').onclick = () => openForm(null);
$('qtyMinus').onclick = () => { $('qty').value = Math.max(1, clampQty($('qty').value) - 1); };
$('qtyPlus').onclick = () => { $('qty').value = clampQty($('qty').value) + 1; };
function closeForm() {   // 關閉表單並清空暫存（不寫入資料庫）
  $('sheet').classList.add('hidden');
  editId = null; photo = null; $('scanMsg').className = 'hidden';
  $('camIn').value = ''; $('galIn').value = '';
  $('prevWrap').classList.add('hidden');
}
$('closeBtn').onclick = closeForm;
$('cancelBtn').onclick = closeForm;
$('camBtn').onclick = () => $('camIn').click();
$('galBtn').onclick = () => $('galIn').click();
async function onFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  try {
    photo = await compress(f);
    $('prev').src = URL.createObjectURL(photo);
    $('prevInfo').textContent = `已壓縮：${(f.size / 1024).toFixed(0)} KB → ${(photo.size / 1024).toFixed(0)} KB`;
    $('prevWrap').classList.remove('hidden');
  } catch (err) { alert(err.message); }
}
$('camIn').onchange = onFile; $('galIn').onchange = onFile;
$('saveBtn').onclick = async () => {
  const name = $('name').value.trim(), l1 = $('l1').value.trim();
  if (!name) return alert('請輸入物品名稱');
  if (!l1) return alert('請選擇或輸入第一層空間');
  const l2 = $('l2').value.trim(), l3 = $('l3').value.trim();
  const note = $('note').value.trim(), quantity = clampQty($('qty').value);
  const old = editId ? items.find(i => i.id === editId) : null;
  $('saveBtn').disabled = true;
  await guard(async () => {
    let photo_path = old ? old.photo_path : null;      // 編輯時沒換照片 → 保留原本的圖片
    if (photo) photo_path = await upload(photo);
    const row = { name, l1, l2, l3, quantity, note, photo_path };
    if (editId) {
      must(await sb.from('items').update(row).eq('id', editId));
      if (photo && old) await rm([old.photo_path]);    // 換了新照片才刪舊檔
    } else must(await sb.from('items').insert(row));
    await load(false);
    $('sheet').classList.add('hidden'); editId = null;
    $('q').value = ''; sp = l1; sel2 = l2; sel3 = ''; editing = false;
    renderAll();
  });
  $('saveBtn').disabled = false;
};

/* ---------- 登入、即時同步、啟動 ---------- */
function subscribe() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('stash-' + user.id);
  ['items', 'pins', 'spaces'].forEach(t => channel.on('postgres_changes', { event: '*', schema: 'public', table: t }, () => {
    clearTimeout(reloadT);
    reloadT = setTimeout(async () => {
      if (drag) return;
      try { await load(false); renderAll(); } catch (e) { console.error(e); }
    }, 500);
  }));
  channel.subscribe();
}
async function onSession(session) {
  if (!booted) { booted = true; busy(-1); }
  const u = session && session.user;
  if (!u) {
    user = null; items = []; pins = []; maps = {}; sp = '';
    if (channel) { sb.removeChannel(channel); channel = null; }
    $('login').classList.remove('hidden');
    return;
  }
  if (user && user.id === u.id) return;   // 只是 token 更新
  user = u;
  $('login').classList.add('hidden');
  const m = u.user_metadata || {}, pic = m.avatar_url || m.picture;
  $('avatar').style.backgroundImage = pic ? `url("${pic}")` : '';
  $('avatar').textContent = pic ? '' : (u.email || '?')[0].toUpperCase();
  await guard(async () => {
    await load(false);
    sp = spaces().find(s => maps[s]) || spaces()[0];
    renderAll();
    subscribe();
  });
}
$('avatar').onclick = () => user && alert('目前登入：' + user.email);
$('logoutBtn').onclick = async () => { if (confirm('確定登出？')) await sb.auth.signOut(); };
$('loginBtn').onclick = async () => {
  busy(1);
  const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + window.location.pathname } });
  if (error) { busy(-1); $('loginErr').textContent = '登入失敗：' + error.message; }
};
(function start() {
  if (!/^https:\/\/.+\.supabase\.co/.test(SUPABASE_URL) || SUPABASE_ANON_KEY.startsWith('在這裡')) {
    $('login').classList.remove('hidden');
    $('loginBtn').classList.add('hidden');
    $('loginErr').textContent = '請先在 index.html 最上方填入 SUPABASE_URL 與 SUPABASE_ANON_KEY';
    return;
  }
  busy(1);   // 等待登入狀態確認
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((ev, session) => setTimeout(() => onSession(session), 0));
})();
</script>
<script>
/* PWA：註冊 Service Worker（需 https 或 localhost） */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(e => console.warn('Service Worker 註冊失敗', e)));
}
</script>
</body>
</html>
